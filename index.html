<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower of Hanoi - Candy Land</title>
<meta name="description" content="Tower of Hanoi - Candy Land: a colorful, kid-friendly puzzle game.">
<link rel="icon" type="image/png" href="girl.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF0F6;
    --title: #E75699;
    --move: #9B5DE5;
    --hint: #B07CC6;
    --error: #FF6B8A;
    --btn: #FF9ED2;
    --btn-active: #FF7BC1;
    --btn-fg: #6B2D5B;
    --dialog-bg: #FFE3F1;
    --font: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: var(--font);
    color: var(--btn-fg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 932px; padding: 12px 16px 16px; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 6px;
  }
  h1 { margin: 0; font-size: 32px; font-weight: 700; color: var(--title); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .controls label, .moves { font-size: 16px; font-weight: 700; }
  .controls label { color: var(--hint); display: flex; align-items: center; gap: 6px; }
  .moves { color: var(--move); }
  select {
    font: 700 16px var(--font);
    color: var(--btn-fg);
    background: #fff;
    border: 1px solid var(--btn);
    border-radius: 8px;
    padding: 4px 8px;
    cursor: pointer;
  }
  button {
    font: 700 16px var(--font);
    color: var(--btn-fg);
    background: var(--btn);
    border: 0;
    border-radius: 10px;
    padding: 6px 16px;
    cursor: pointer;
  }
  button:hover, button:active { background: var(--btn-active); }
  button.plain { background: #fff; }
  button.plain:hover, button.plain:active { background: var(--btn); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--move); outline-offset: 2px; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 900 / 480;
    touch-action: none;
    user-select: none;
    cursor: pointer;
  }
  #hint {
    text-align: center;
    font-size: 15px;
    color: var(--hint);
    margin: 4px 0 0;
    min-height: 1.4em;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255, 240, 246, 0.55);
    padding: 16px;
  }
  .overlay.open { display: flex; }
  .dialog {
    background: var(--dialog-bg);
    border-radius: 20px;
    padding: 22px 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(231, 86, 153, 0.25);
    max-width: 100%;
  }
  .dialog h2 { margin: 0 0 8px; font-size: 29px; color: var(--title); }
  .dialog p { margin: 0; font-size: 16px; font-weight: 700; }
  .dialog .verdict { font-size: 15px; font-weight: 400; margin: 4px 0 16px; }
  .dialog .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tower of Hanoi</h1>
    <div class="controls">
      <label>Disks:
        <select id="disks" aria-label="Number of disks">
          <option>3</option><option selected>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option>
        </select>
      </label>
      <span class="moves" id="moves">Moves: 0 &nbsp; Best: 15</span>
      <button id="newGame" type="button">New Game</button>
    </div>
  </header>
  <canvas id="board" width="900" height="480" aria-label="Tower of Hanoi board"></canvas>
  <p id="hint"></p>
</div>

<div class="overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="dialog">
    <h2 id="winTitle">You did it! 🍭</h2>
    <p id="winMoves"></p>
    <p class="verdict" id="winVerdict"></p>
    <div class="btns">
      <button id="playAgain" type="button">Play Again</button>
      <button id="closeWin" class="plain" type="button">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const W = 900, H = 480;
  const BASE_Y = 410, PEG_H = 240, PEG_W = 16;
  const PEG_X = [160, 450, 740];
  const DISK_H = 34, MAX_DISK_W = 230, MIN_DISK_W = 80;
  const DRAG_THRESHOLD = 8;

  const C = {
    bg: "#FFF0F6", title: "#E75699", move: "#9B5DE5", hint: "#B07CC6",
    error: "#FF6B8A", peg: "#C9A7EB", pegOutline: "#A67BD4",
    board: "#E5C3FF", boardOutline: "#C9A0DC", highlight: "#FFF4B8",
    diskText: "#8A4F7D", perfect: "#2DBE7E",
  };
  const CANDY = ["#FFB5E8", "#FFC9DE", "#FDD5B1", "#FFF1A8", "#C7F9CC", "#B0E0FF", "#D5C6FF", "#F5B7FF"];
  const SPRINKLE = ["#FF9ED2", "#B0E0FF", "#FFF1A8", "#C7F9CC", "#D5C6FF", "#FFC9DE", "#FDD5B1"];
  const FONT = '"Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive';
  const DEFAULT_HINT = "Drag a disk (or tap it, then tap a peg) — move every disk to the right peg!  ✿";

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const disksSel = document.getElementById("disks");
  const movesEl = document.getElementById("moves");
  const hintEl = document.getElementById("hint");
  const overlay = document.getElementById("winOverlay");

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const s = {
    n: 4, pegs: [[], [], []], moves: 0, selected: null, won: false,
    sprinkles: [], pending: null, press: { x: 0, y: 0 },
    dragging: false, dragSrc: null, dragPos: { x: 0, y: 0 }, dragGrab: { x: 0, y: 0 },
    confetti: [], confettiRaf: null, hintTimer: null,
  };

  // ---------- canvas sizing (sharp on high-DPI screens) ----------
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }

  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  // ---------- sound (Web Audio) ----------
  let audio = null;
  function ensureAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio = new AC();
    }
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function tone(freq, ms, when = 0) {
    const a = ensureAudio();
    if (!a) return;
    const t0 = a.currentTime + when, dur = ms / 1000;
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    g.gain.setValueAtTime(0.18, t0 + Math.max(0.01, dur - 0.03));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(a.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function winSound() {
    const notes = [[523, 120], [659, 120], [784, 120], [1046, 220], [784, 100], [1046, 350]];
    let t = 0;
    for (const [f, d] of notes) { tone(f, d, t); t += d / 1000; }
  }

  // ---------- hint ----------
  function setHint(text, color = C.hint, revert = true) {
    clearTimeout(s.hintTimer);
    s.hintTimer = null;
    hintEl.textContent = text;
    hintEl.style.color = color;
    if (revert && text !== DEFAULT_HINT) {
      s.hintTimer = setTimeout(() => setHint(DEFAULT_HINT, C.hint, false), 2200);
    }
  }

  // ---------- game state ----------
  function newGame(n) {
    s.n = n;
    disksSel.value = String(n);
    s.pegs = [Array.from({ length: n }, (_, i) => n - i), [], []];
    s.moves = 0;
    s.selected = null;
    s.won = false;
    s.pending = null;
    s.dragging = false;
    s.dragSrc = null;
    stopConfetti();
    s.sprinkles = Array.from({ length: 48 }, () => ({
      x: randInt(10, W - 10), y: randInt(10, H - 90), color: pick(SPRINKLE), ang: randInt(-30, 30),
    }));
    closeWin();
    updateMoves();
    setHint(DEFAULT_HINT, C.hint, false);
    render();
  }

  function updateMoves() {
    movesEl.textContent = `Moves: ${s.moves}   Best: ${(1 << s.n) - 1}`;
    movesEl.style.whiteSpace = "pre";
  }

  const diskWidth = (size) =>
    s.n <= 1 ? MAX_DISK_W : MIN_DISK_W + (size - 1) * (MAX_DISK_W - MIN_DISK_W) / (s.n - 1);

  function pegAt(x) {
    if (x == null || x < 0 || x > W) return null;
    return x < 300 ? 0 : x < 600 ? 1 : 2;
  }

  // ---------- drawing ----------
  function roundRect(x1, y1, x2, y2, r) {
    r = Math.max(0, Math.min(r, (x2 - x1) / 2, (y2 - y1) / 2));
    ctx.beginPath();
    ctx.moveTo(x1 + r, y1);
    ctx.arcTo(x2, y1, x2, y2, r);
    ctx.arcTo(x2, y2, x1, y2, r);
    ctx.arcTo(x1, y2, x1, y1, r);
    ctx.arcTo(x1, y1, x2, y1, r);
    ctx.closePath();
  }

  function drawDiskAt(x1, y1, size) {
    const w = diskWidth(size);
    roundRect(x1, y1, x1 + w, y1 + DISK_H, DISK_H / 2 - 2);
    ctx.fillStyle = CANDY[(size - 1) % CANDY.length];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#FFFFFF";
    ctx.stroke();
    ctx.fillStyle = C.diskText;
    ctx.font = `bold 16px ${FONT}`;
    ctx.fillText(String(size), x1 + w / 2, y1 + DISK_H / 2 + 1);
  }

  function diskTopLeft(peg, index, size, lift = 0) {
    const w = diskWidth(size);
    const yBottom = BASE_Y - index * DISK_H - lift;
    return { x: PEG_X[peg] - w / 2, y: yBottom - DISK_H };
  }

  function render() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.lineCap = "round";
    ctx.lineWidth = 3;
    for (const sp of s.sprinkles) {
      const rad = sp.ang * Math.PI / 180;
      ctx.strokeStyle = sp.color;
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(sp.x + 7 * Math.cos(rad), sp.y + 7 * Math.sin(rad));
      ctx.stroke();
    }

    if (s.selected !== null) {
      const px = PEG_X[s.selected];
      roundRect(px - 95, BASE_Y - PEG_H - 30, px + 95, BASE_Y + 8, 24);
      ctx.fillStyle = C.highlight;
      ctx.fill();
    }

    roundRect(40, BASE_Y, 860, BASE_Y + 40, 18);
    ctx.fillStyle = C.board;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = C.boardOutline;
    ctx.stroke();

    PEG_X.forEach((px, i) => {
      roundRect(px - PEG_W / 2, BASE_Y - PEG_H, px + PEG_W / 2, BASE_Y + 4, 7);
      ctx.fillStyle = C.peg;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = C.pegOutline;
      ctx.stroke();
      ctx.fillStyle = C.move;
      ctx.font = `bold 19px ${FONT}`;
      ctx.fillText("ABC"[i], px, BASE_Y + 54);
    });

    for (let p = 0; p < 3; p++) {
      const stack = s.pegs[p];
      stack.forEach((size, i) => {
        const top = i === stack.length - 1;
        if (s.dragging && p === s.dragSrc && top) return;
        const lift = s.selected === p && top ? 24 : 0;
        const tl = diskTopLeft(p, i, size, lift);
        drawDiskAt(tl.x, tl.y, size);
      });
    }

    if (s.selected !== null) {
      ctx.fillStyle = C.title;
      ctx.font = `15px ${FONT}`;
      ctx.fillText("picked up!", PEG_X[s.selected], BASE_Y - PEG_H - 48);
    }

    if (s.dragging && s.dragSrc !== null) {
      const stack = s.pegs[s.dragSrc];
      drawDiskAt(s.dragPos.x, s.dragPos.y, stack[stack.length - 1]);
    }

    for (const c of s.confetti) {
      ctx.fillStyle = c.color;
      ctx.fillRect(c.x, c.y, c.w, c.h);
    }
    ctx.restore();
  }

  // ---------- input ----------
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    ensureAudio();
    if (s.won) return;
    canvas.setPointerCapture(e.pointerId);
    const pt = toLogical(e);
    const peg = pegAt(pt.x);
    s.press = pt;
    s.dragging = false;

    if (s.selected !== null) { s.pending = { kind: "move", peg }; return; }
    if (peg === null || !s.pegs[peg].length) { s.pending = null; return; }
    s.pending = { kind: "drag", peg };
    s.dragSrc = peg;
  });

  canvas.addEventListener("pointermove", (e) => {
    const pt = toLogical(e);
    if (s.dragging) {
      s.dragPos = { x: pt.x - s.dragGrab.x, y: pt.y - s.dragGrab.y };
      render();
      return;
    }
    if (s.won || !s.pending || s.pending.kind !== "drag") return;
    if (Math.abs(pt.x - s.press.x) < DRAG_THRESHOLD && Math.abs(pt.y - s.press.y) < DRAG_THRESHOLD) return;

    const src = s.dragSrc;
    const stack = s.pegs[src];
    if (!stack.length) { s.pending = null; return; }
    const tl = diskTopLeft(src, stack.length - 1, stack[stack.length - 1]);
    s.dragGrab = { x: s.press.x - tl.x, y: s.press.y - tl.y };
    s.dragPos = { x: pt.x - s.dragGrab.x, y: pt.y - s.dragGrab.y };
    s.dragging = true;
    tone(700, 40);
    render();
  });

  function onRelease(e, cancelled = false) {
    if (s.won) { s.pending = null; s.dragging = false; return; }
    const pending = s.pending;
    s.pending = null;
    const pt = toLogical(e);

    if (s.dragging) {
      const src = s.dragSrc;
      const target = cancelled ? null : pegAt(pt.x);
      s.dragging = false;
      s.dragSrc = null;
      if (target === null) render();
      else if (!tryMove(src, target)) render();
      return;
    }
    if (!pending || cancelled) return;

    if (pending.kind === "move") {
      const target = pegAt(pt.x);
      if (target === null) return;
      if (target === s.selected) { clearSelection(); return; }
      const src = s.selected;
      s.selected = null;
      if (!tryMove(src, target)) render();
      return;
    }

    if (pending.kind === "drag") {
      const clicked = pegAt(pt.x);
      if (clicked !== null && s.pegs[clicked].length) {
        s.selected = clicked;
        tone(880, 50);
        setHint("Now tap the peg where you want to drop it!", C.title, false);
        render();
      }
    }
  }
  canvas.addEventListener("pointerup", (e) => onRelease(e));
  canvas.addEventListener("pointercancel", (e) => onRelease(e, true));

  function clearSelection() {
    if (s.selected !== null) {
      s.selected = null;
      setHint(DEFAULT_HINT, C.hint, false);
      render();
    }
  }

  function tryMove(src, dst) {
    if (src === null || dst === null || src === dst) return false;
    if (!s.pegs[src].length) {
      tone(220, 120);
      setHint("That peg has no disks!", C.error);
      return false;
    }
    const moving = s.pegs[src][s.pegs[src].length - 1];
    const dstStack = s.pegs[dst];
    if (dstStack.length && dstStack[dstStack.length - 1] < moving) {
      tone(200, 160);
      setHint("Oops! A bigger disk can't go on a smaller one. ✗", C.error);
      return false;
    }
    s.pegs[src].pop();
    dstStack.push(moving);
    s.moves++;
    updateMoves();
    tone(620, 60);
    render();

    if (s.pegs[2].length === s.n) {
      s.won = true;
      setHint("You did it! 🍬", C.title, false);
      setTimeout(celebrate, 250);
    }
    return true;
  }

  // ---------- winning ----------
  function celebrate() {
    if (!s.won) return;
    startConfetti();
    winSound();
    showWin();
  }

  function startConfetti() {
    s.confetti = Array.from({ length: 100 }, () => ({
      x: randInt(0, W), y: randInt(-140, -10), w: randInt(6, 12), h: randInt(8, 16),
      color: pick(CANDY), dx: rand(-2.5, 2.5), dy: rand(4, 8),
    }));
    let last = performance.now();
    const step = (now) => {
      const k = Math.min((now - last) / 40, 3);
      last = now;
      for (const c of s.confetti) { c.x += c.dx * k; c.y += c.dy * k; }
      s.confetti = s.confetti.filter((c) => c.y < H + 20);
      render();
      s.confettiRaf = s.confetti.length ? requestAnimationFrame(step) : null;
    };
    s.confettiRaf = requestAnimationFrame(step);
  }

  function stopConfetti() {
    if (s.confettiRaf) cancelAnimationFrame(s.confettiRaf);
    s.confettiRaf = null;
    s.confetti = [];
  }

  function showWin() {
    const best = (1 << s.n) - 1;
    document.getElementById("winMoves").textContent = `You finished in ${s.moves} moves!`;
    const v = document.getElementById("winVerdict");
    if (s.moves === best) {
      v.textContent = "Perfect! That's the optimal solution!";
      v.style.color = C.perfect;
    } else {
      v.textContent = `Optimal is ${best} moves — try again for perfect!`;
      v.style.color = C.move;
    }
    overlay.classList.add("open");
    document.getElementById("playAgain").focus();
  }

  function closeWin() { overlay.classList.remove("open"); }

  // ---------- controls ----------
  disksSel.addEventListener("change", () => newGame(parseInt(disksSel.value, 10)));
  document.getElementById("newGame").addEventListener("click", () => newGame(parseInt(disksSel.value, 10)));
  document.getElementById("playAgain").addEventListener("click", () => newGame(parseInt(disksSel.value, 10)));
  document.getElementById("closeWin").addEventListener("click", closeWin);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (overlay.classList.contains("open")) closeWin();
    else clearSelection();
  });
  window.addEventListener("resize", () => {
    if (Math.round(W * Math.min(window.devicePixelRatio || 1, 3)) !== canvas.width) resizeCanvas();
  });

  newGame(4);
  resizeCanvas();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
